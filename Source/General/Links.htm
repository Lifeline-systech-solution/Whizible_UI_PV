	function MyProfile_OnClick()
	{
		window.open("../HR/EmployeeProfile.asp", "", "resizable=yes,scrollbars=yes,toolbar=no,statusbar=no,left=" & (window.screen.width - 800)/2 & ",top=" & (window.screen.height - 600)/2 & ",width=800,height=600");
	}
	function ShowText(objTDCell,backgroundColor,textColor) {		
	
		objTDCell.className=backgroundColor;
		objTDCell.style.color = textColor;									
	}
	
	function changeTo(highlightColor,textColor,e){	
		
	source=e.srcElement;	
			if((source.tagName == "TR") || (source.tagName == "TABLE"))
			return
		
		while(source.tagName!="TD")
			source=source.parentElement
			
		source.style.cursor = 'hand'
		
		if((source.style.backgroundColor != highlightColor) && (source.id != "ignore"))		
			ShowText(source,highlightColor,textColor)		
			
	}

	function changeBack(originalColor,textColor,e){		
			
		if(e.fromElement.contains(e.toElement) || source.contains(e.toElement) || source.id=="ignore")
				return
			
		if(e.toElement != source)		
			ShowText(source,originalColor,textColor)		
			
	}
	
	function Tab_OnClick(strFromWhere)
	{
		window.open("Navigation.aspx?FromWhere=" + strFromWhere,"_top")
	}
	
	function Logout(strLogoutPage)
	{

	}
