		<Script language="javascript">
		var objform=GetFormReference('frmChangePassword');
		var objdivlist=GetObjectReference('frmChangePassword','PageDiv');
		//The div tag has id as PageDiv 
		function window_onload()
		{
			var intDivHeight ;
			var intDivHeightRisk;
			if (objdivlist !=null) {
			intDivHeight = document.body.offsetHeight - objdivlist.offsetTop - 40;
			if (intDivHeight < 100)	intDivHeight = 100;
			objdivlist.style.height = intDivHeight;	}	
			setFocus(GetObjectReference('frmChangePassword', 'txtLoginName'));		
		}
		
		function window_onresize()		
		{
			var intDivHeight;
			var intDivHeightRisk;
			if (objdivlist !=null) {
			intDivHeight = document.body.offsetHeight - objdivlist.offsetTop - 40;
			if (intDivHeight < 100)	intDivHeight = 100;
			objdivlist.style.height = intDivHeight;	}
		}	
		function SetPassword_OnClick()
		{
		  debugger;
			if (Validate() == true)
			{
			   var objtxtLoginName = GetObjectReference('frmChangePassword','txtLoginName'); 
			    if(objtxtLoginName != null) 
			    {
			        objtxtLoginName.disabled=false;
			    }
				objform.action = "../SM/SM_ChangePassword.aspx?Mode=SetPassword";
				objform.submit();
			}
		}
		function Validate()
		{
			var objLoginName = GetObjectReference('frmChangePassword', 'txtLoginName');
			var objOldPwd = GetObjectReference('frmChangePassword', 'txtOldPassword');
			var objNewPwd = GetObjectReference('frmChangePassword', 'txtNewPassword');
			var objConfirmPwd = GetObjectReference('frmChangePassword', 'txtConfirmPassword');
			
			if (objLoginName != null && disallowBlank(objLoginName, 'The &#39;Login Name&#39; field should not be left blank.') == true)
			{
				return false;
			}
			if (objOldPwd != null && disallowBlank(objOldPwd, 'The &#39;Old Password&#39; field should not be left blank.') == true)
			{
				return false;
			}
			if (objNewPwd != null && disallowBlank(objNewPwd, 'The &#39;New Password&#39; field should not be left blank.') == true)
			{
				return false;
			}
			if (objConfirmPwd != null && disallowBlank(objConfirmPwd, 'The &#39;Confirm Password&#39; field should not be left blank.') == true)
			{
				return false;
			}
			if (objNewPwd != null && TrimAll(objNewPwd.value).length < 6)
			{
				alert('The password should have atleast six characters.');
				setFocus(objNewPwd);
				return false;
			}
			if (objNewPwd != null && objConfirmPwd != null && disallowValue1NotEqualToValue2(objConfirmPwd, objNewPwd, 'The &#39;New Password&#39; and &#39;Confirm Password&#39; fields do not match.') == true)
			{
				return false;
			}
			return true;
		}
		</Script>
